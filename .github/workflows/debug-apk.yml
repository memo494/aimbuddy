name: Build Debug APK

# Builds an unsigned-by-upload-key debug APK (signed with the default debug key)
# and attaches it to the run as a downloadable artifact. No release is created.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assemblePrimaryDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: AimBuddy-debug-${{ github.sha }}
          path: app/build/outputs/apk/primary/debug/*.apk
          retention-days: 30
